name: Bot Divida Ativa

on:
  schedule:
    - cron: "0 */6 * * *"   # liga a cada 6 horas (cada execução dura até ~5h50)
  workflow_dispatch:         # permite ligar manualmente

concurrency:
  group: divida-ativa
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install firebase-admin python-dotenv
      # guarda a base da PGFN entre execuções (evita baixar tudo de novo)
      - uses: actions/cache@v4
        with:
          path: dados_pgfn
          key: pgfn-${{ github.run_id }}
          restore-keys: pgfn-
      - name: Rodar robô
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DIVIDA_MAX_HORAS: "5.8"
        run: python bot_divida_ativa.py
